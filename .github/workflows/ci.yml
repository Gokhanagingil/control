name: Control GRC CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install hash-locked runtime dependencies
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py ui.py ui_v2.py identity.py bootstrap.py backup.py execution_service.py seed_reference.py seed_itil.py grc_plus.py grc_excel.py xlsx_io.py tests scripts
      - name: Validate browser JavaScript
        run: |
          python -c "import ui; open('/tmp/control-ui.js','w').write(ui.HTML.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/control-ui.js
          node --check ksgrc.js
          python -c "import identity; open('/tmp/control-login.js','w').write(identity.LOGIN_HTML.split('<script>',1)[1].split('</script>',1)[0]); open('/tmp/control-change.js','w').write(identity.CHANGE_HTML.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/control-login.js
          node --check /tmp/control-change.js
      - name: Unit and HTTP integration tests
        run: |
          set -o pipefail
          mkdir -p verification
          python -m unittest discover -s tests -v 2>&1 | tee verification/regression.log
      - name: Install browser test dependencies
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser acceptance with synthetic data
        run: |
          set -o pipefail
          python scripts/browser_smoke.py 2>&1 | tee verification/browser.log
      - name: Validate isolated Docker Compose
        env:
          CONTROL_API_KEY: a-test-api-key-not-for-deployment
          CONTROL_UI_USER: test-user
        run: docker compose -f compose.yaml config --quiet
      - name: Docker build
        run: docker build -t control-grc:ci .
      - name: Package tested source (tracked files only, no credentials)
        if: always()
        run: |
          mkdir -p verification
          git archive --format=zip HEAD -o verification/source.zip
          git rev-parse HEAD > verification/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-${{ github.run_id }}
          path: verification/
          retention-days: 14
