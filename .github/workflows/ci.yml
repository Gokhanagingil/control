name: Control GRC CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q app.py ui.py tests
      - name: Validate browser JavaScript
        run: |
          python -c "import ui; open('/tmp/control-ui.js','w').write(ui.HTML.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/control-ui.js
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Docker build
        run: docker build -t control-grc:ci .
