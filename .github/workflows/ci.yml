name: Control GRC CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q app.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Docker build
        run: docker build -t control-grc:ci .
