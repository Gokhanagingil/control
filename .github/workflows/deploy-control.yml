name: Deploy Control GRC (isolated)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-grc-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: control-grc
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent deployment secrets
        env:
          HOST: ${{ secrets.CONTROL_SSH_HOST }}
          USER: ${{ secrets.CONTROL_SSH_USER }}
          KEY: ${{ secrets.CONTROL_SSH_KEY }}
          API_KEY: ${{ secrets.CONTROL_API_KEY }}
          UI_USER: ${{ secrets.CONTROL_UI_USER }}
          UI_PASSWORD: ${{ secrets.CONTROL_UI_PASSWORD }}
        run: |
          test -n "$HOST" && test -n "$USER" && test -n "$KEY"
          test "${#API_KEY}" -ge 32
          test -n "$UI_USER" && test "${#UI_PASSWORD}" -ge 24
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.CONTROL_SSH_KEY }}
          SSH_HOST: ${{ secrets.CONTROL_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.CONTROL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Copy isolated release
        env:
          SSH_HOST: ${{ secrets.CONTROL_SSH_HOST }}
          SSH_USER: ${{ secrets.CONTROL_SSH_USER }}
        run: |
          set -euo pipefail
          ssh "$SSH_USER@$SSH_HOST" 'mkdir -p /opt/control-grc'
          scp app.py Dockerfile compose.yaml "$SSH_USER@$SSH_HOST:/opt/control-grc/"
      - name: Deploy only Control GRC
        env:
          SSH_HOST: ${{ secrets.CONTROL_SSH_HOST }}
          SSH_USER: ${{ secrets.CONTROL_SSH_USER }}
          API_KEY: ${{ secrets.CONTROL_API_KEY }}
          UI_USER: ${{ secrets.CONTROL_UI_USER }}
          UI_PASSWORD: ${{ secrets.CONTROL_UI_PASSWORD }}
        run: |
          set -euo pipefail
          printf 'CONTROL_API_KEY=%s\nCONTROL_UI_USER=%s\nCONTROL_UI_PASSWORD=%s\n' "$API_KEY" "$UI_USER" "$UI_PASSWORD" | ssh "$SSH_USER@$SSH_HOST" 'umask 077; cat > /opt/control-grc/.env'
          ssh "$SSH_USER@$SSH_HOST" 'cd /opt/control-grc && docker compose -p control-grc up -d --build --no-deps && docker compose -p control-grc ps && docker compose -p control-grc exec -T app python -c "import urllib.request,os; print(urllib.request.urlopen(urllib.request.Request(\"http://127.0.0.1:8080/api/health\",headers={\"X-API-Key\":os.environ[\"CONTROL_API_KEY\"]}),timeout=10).read().decode())"'
