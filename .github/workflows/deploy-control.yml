name: Deploy Control GRC (isolated)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".control-deploy-request"

permissions:
  contents: read
  statuses: write

concurrency:
  group: control-grc-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: control-grc
    steps:
      - uses: actions/checkout@v4
      - name: Validate application before connecting to NILES host
        run: |
          set -euo pipefail
          python3 -m compileall -q app.py ui.py tests
          python3 -c "import ui; open('/tmp/control-ui.js','w').write(ui.HTML.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/control-ui.js
          python3 -m unittest discover -s tests -v
          docker build --tag control-grc:preflight .
      - name: Verify independent deployment secrets
        env:
          HOST: ${{ secrets.CONTROL_SSH_HOST }}
          USER: ${{ secrets.CONTROL_SSH_USER }}
          KEY: ${{ secrets.CONTROL_SSH_KEY }}
          API_KEY: ${{ secrets.CONTROL_API_KEY }}
          UI_USER: ${{ secrets.CONTROL_UI_USER }}
          UI_PASSWORD: ${{ secrets.CONTROL_UI_PASSWORD }}
        run: |
          test -n "$HOST" && test -n "$USER" && test -n "$KEY"
          test "${#API_KEY}" -ge 32
          test -n "$UI_USER" && test "${#UI_PASSWORD}" -ge 24
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.CONTROL_SSH_KEY }}
          SSH_HOST: ${{ secrets.CONTROL_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.CONTROL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Copy isolated release
        env:
          SSH_HOST: ${{ secrets.CONTROL_SSH_HOST }}
          SSH_USER: ${{ secrets.CONTROL_SSH_USER }}
        run: |
          set -euo pipefail
          ssh "$SSH_USER@$SSH_HOST" 'mkdir -p /opt/control-grc'
          scp app.py ui.py Dockerfile compose.yaml "$SSH_USER@$SSH_HOST:/opt/control-grc/"
      - name: Deploy only Control GRC
        env:
          SSH_HOST: ${{ secrets.CONTROL_SSH_HOST }}
          SSH_USER: ${{ secrets.CONTROL_SSH_USER }}
          API_KEY: ${{ secrets.CONTROL_API_KEY }}
          UI_USER: ${{ secrets.CONTROL_UI_USER }}
          UI_PASSWORD: ${{ secrets.CONTROL_UI_PASSWORD }}
        run: |
          set -euo pipefail
          printf 'CONTROL_API_KEY=%s\nCONTROL_UI_USER=%s\nCONTROL_UI_PASSWORD=%s\n' "$API_KEY" "$UI_USER" "$UI_PASSWORD" |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'umask 077; cat > /opt/control-grc/.env'
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          cd /opt/control-grc
          docker compose -p control-grc up -d --build --no-deps
          docker compose -p control-grc ps
          for i in $(seq 1 25); do
            if docker compose -p control-grc exec -T app python -c 'import os,urllib.request; request=urllib.request.Request("http://127.0.0.1:8080/api/health", headers={"X-API-Key":os.environ["CONTROL_API_KEY"]}); print(urllib.request.urlopen(request,timeout=4).read().decode())'; then
              echo CONTROL_GRC_HEALTH_OK
              exit 0
            fi
            sleep 2
          done
          echo CONTROL_GRC_HEALTH_FAIL >&2
          exit 1
          REMOTE
      - name: Remove temporary deployment private key copy from server
        env:
          SSH_HOST: ${{ secrets.CONTROL_SSH_HOST }}
          SSH_USER: ${{ secrets.CONTROL_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'if [ "$(id -u)" = "0" ]; then rm -f -- /root/.ssh/control_grc_deploy /root/.ssh/control_grc_deploy.pub; fi'
      - name: Report deployment status on commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_RESULT" = "success" ]; then
            state=success
            description="Control GRC deployed; container health OK"
          else
            state=failure
            description="Control GRC deployment did not complete; inspect Actions"
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="control-grc/deploy" \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
