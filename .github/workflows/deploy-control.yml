name: Deploy Control GRC (isolated)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".control-deploy-request"]
permissions:
  contents: read
  statuses: write
concurrency:
  group: control-grc-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: control-grc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate application before connecting to NILES host
        run: |
          set -euo pipefail
          python -m compileall -q app.py ui.py ui_v2.py identity.py bootstrap.py backup.py execution_service.py seed_itil.py seed_reference.py grc_plus.py grc_excel.py xlsx_io.py tests scripts
          node --check ksgrc.js
          python -m unittest discover -s tests -v
          CONTROL_API_KEY=preflight-key CONTROL_UI_USER=ci docker compose -f compose.yaml config --quiet
          docker build --tag control-grc:preflight .
      - name: Validate browser before deployment
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python scripts/browser_smoke.py
      - name: Verify independent deployment secrets
        env:
          HOST: ${{ secrets.CONTROL_SSH_HOST }}
          USER: ${{ secrets.CONTROL_SSH_USER }}
          KEY: ${{ secrets.CONTROL_SSH_KEY }}
          API_KEY: ${{ secrets.CONTROL_API_KEY }}
          UI_USER: ${{ secrets.CONTROL_UI_USER }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$KEY"
          test "${#API_KEY}" -ge 32
          test -n "$UI_USER"
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.CONTROL_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CONTROL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Copy isolated release and record other container lifecycles
        env:
          SSH_HOST: ${{ secrets.CONTROL_SSH_HOST }}
          SSH_USER: ${{ secrets.CONTROL_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          mkdir -p /opt/control-grc
          umask 077
          docker ps -q | xargs -r docker inspect --format '{{.Id}} {{.Name}} {{.State.StartedAt}} {{index .Config.Labels "com.docker.compose.project"}}' | grep -v ' control-grc$' | sort > /opt/control-grc/.other-containers-before || test "${PIPESTATUS[0]}" -eq 0
          REMOTE
          scp app.py ui.py ui_v2.py ksgrc.js identity.py bootstrap.py backup.py execution_service.py seed_itil.py seed_reference.py grc_plus.py grc_excel.py xlsx_io.py Dockerfile compose.yaml .dockerignore "$SSH_USER@$SSH_HOST:/opt/control-grc/"
          scp -r seed "$SSH_USER@$SSH_HOST:/opt/control-grc/"
      - name: Back up existing data and deploy only Control GRC
        env:
          SSH_HOST: ${{ secrets.CONTROL_SSH_HOST }}
          SSH_USER: ${{ secrets.CONTROL_SSH_USER }}
          API_KEY: ${{ secrets.CONTROL_API_KEY }}
          UI_USER: ${{ secrets.CONTROL_UI_USER }}
        run: |
          set -euo pipefail
          printf 'CONTROL_API_KEY=%s\nCONTROL_UI_USER=%s\nCONTROL_COOKIE_SECURE=1\n' "$API_KEY" "$UI_USER" |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'umask 077; cat > /opt/control-grc/.env'
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/control-grc
          if docker compose -p control-grc ps --status running --services | grep -qx app; then
            docker compose -p control-grc exec -T app python - < backup.py
          fi
          docker compose -p control-grc up -d --build --no-deps
          docker compose -p control-grc ps
          docker compose -p control-grc exec -T app python /app/seed_reference.py --apply </dev/null
          docker compose -p control-grc exec -T app python /app/seed_itil.py --apply </dev/null
          if [ ! -f /opt/control-grc/.first-login ]; then
            umask 077
            docker compose -p control-grc exec -T app python /app/bootstrap.py create </dev/null > /opt/control-grc/.first-login
            chmod 600 /opt/control-grc/.first-login
          fi
          docker compose -p control-grc exec -T app python -c 'import os,app; db=app.connect(); assert db.execute("SELECT id FROM users WHERE username=? AND is_active=1 AND password_hash IS NOT NULL",(os.environ["CONTROL_UI_USER"],)).fetchone(), "INITIAL_USER_MISSING"; assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"; assert not db.execute("PRAGMA foreign_key_check").fetchone(); assert db.execute("SELECT name FROM sqlite_master WHERE name=?",("execution_receipts",)).fetchone(); db.close(); print("CONTROL_GRC_SCHEMA_USER_INTEGRITY_OK")' </dev/null
          for i in $(seq 1 25); do
            if docker compose -p control-grc exec -T app python -c 'import os,urllib.request,json; headers={"X-API-Key":os.environ["CONTROL_API_KEY"]}; request=urllib.request.Request("http://127.0.0.1:8080/api/health",headers=headers); assert json.load(urllib.request.urlopen(request,timeout=4))["status"]=="ok"; request=urllib.request.Request("http://127.0.0.1:8080/api/controls",headers=headers); controls=json.load(urllib.request.urlopen(request,timeout=4)); assert isinstance(controls,list); print("CONTROL_GRC_HEALTH_AND_API_OK")' </dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo CONTROL_GRC_HEALTH_FAIL >&2
          exit 1
          REMOTE
      - name: Verify other container lifecycles are unchanged
        env:
          SSH_HOST: ${{ secrets.CONTROL_SSH_HOST }}
          SSH_USER: ${{ secrets.CONTROL_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          cd /opt/control-grc
          umask 077
          docker ps -q | xargs -r docker inspect --format '{{.Id}} {{.Name}} {{.State.StartedAt}} {{index .Config.Labels "com.docker.compose.project"}}' | grep -v ' control-grc$' | sort > .other-containers-after || test "${PIPESTATUS[0]}" -eq 0
          cmp --silent .other-containers-before .other-containers-after
          echo OTHER_CONTAINER_LIFECYCLES_UNCHANGED
          REMOTE
      - name: Verify externally reachable HTTPS preview
        env:
          SSH_HOST: ${{ secrets.CONTROL_SSH_HOST }}
          SSH_USER: ${{ secrets.CONTROL_SSH_USER }}
        run: |
          set -euo pipefail
          PUBLIC_URL="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cd /opt/control-grc; docker compose -p control-grc logs --no-color --tail=150 preview 2>&1' | grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' | tail -1)"
          [[ "$PUBLIC_URL" =~ ^https://[a-z0-9-]+\.trycloudflare\.com$ ]]
          for i in $(seq 1 12); do
            if curl --location --fail --silent --show-error --max-time 12 "$PUBLIC_URL/login" | grep -q 'KS GRC'; then
              echo "CONTROL_GRC_HTTPS_PREVIEW_OK=$PUBLIC_URL"
              printf '### KS GRC staging\n\nCommit: `%s`\n\n%s\n' "$GITHUB_SHA" "$PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 3
          done
          echo CONTROL_GRC_HTTPS_PREVIEW_UNAVAILABLE >&2
          exit 1
      - name: Report deployment status on commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_RESULT" = success ]; then state=success; else state=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="control-grc/deploy" -f description="Control GRC deployment: $JOB_RESULT" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
